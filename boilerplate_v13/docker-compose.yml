name: boilerplate-v13

services:
  nginx:
    build:
      context: .
      dockerfile: ./environment/nginx/Dockerfile
    container_name: nginx
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www
      - ./environment/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./environment/nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - laravel-v13
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: ./environment/backend/Dockerfile
    container_name: backend
    environment:
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
    volumes:
      - ./:/var/www
      - ./environment/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    command: /var/www/environment/backend/start.sh
    networks:
      - laravel-v13
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:9.0
    container_name: mysql
    restart: always
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - v13-mysql-data:/var/lib/mysql
    networks:
      - laravel-v13
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    networks:
      - laravel-v13

  queue:
    build:
      context: .
      dockerfile: ./environment/backend/Dockerfile
    container_name: queue
    environment:
      CONTAINER_ROLE: queue
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
    volumes:
      - ./:/var/www
    command: /var/www/environment/backend/start.sh
    networks:
      - laravel-v13
    depends_on:
      - mysql
      - redis

  scheduler:
    build:
      context: .
      dockerfile: ./environment/backend/Dockerfile
    container_name: scheduler
    environment:
      CONTAINER_ROLE: scheduler
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
    volumes:
      - ./:/var/www
    command: /var/www/environment/backend/start.sh
    networks:
      - laravel-v13
    depends_on:
      - mysql

networks:
  laravel-v13:
    driver: bridge

volumes:
  v13-mysql-data:
    driver: local
